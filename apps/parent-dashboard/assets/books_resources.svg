<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
  <defs>
    <linearGradient id='bulbGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FDE047'/>
      <stop offset='100%' stop-color='#F59E0B'/>
    </linearGradient>
    <linearGradient id='book1' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#3B82F6'/>
      <stop offset='100%' stop-color='#1D4ED8'/>
    </linearGradient>
    <linearGradient id='book2' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#10B981'/>
      <stop offset='100%' stop-color='#047857'/>
    </linearGradient>
    <linearGradient id='book3' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#EC4899'/>
      <stop offset='100%' stop-color='#BE185D'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <!-- Glowing Lightbulb -->
  <circle cx='100' cy='65' r='38' fill='url(#bulbGrad)' filter='url(#glow)' opacity='0.3'/>
  <circle cx='100' cy='65' r='28' fill='url(#bulbGrad)'/>
  <path d='M92 88h16v10H92z' fill='#94A3B8'/>
  <path d='M94 98h12v4H94z' fill='#64748B'/>
  <!-- Rays -->
  <line x1='100' y1='22' x2='100' y2='12' stroke='#F59E0B' stroke-width='4' stroke-linecap='round'/>
  <line x1='65' y1='36' x2='57' y2='28' stroke='#F59E0B' stroke-width='4' stroke-linecap='round'/>
  <line x1='135' y1='36' x2='143' y2='28' stroke='#F59E0B' stroke-width='4' stroke-linecap='round'/>
  <line x1='50' y1='65' x2='40' y2='65' stroke='#F59E0B' stroke-width='4' stroke-linecap='round'/>
  <line x1='150' y1='65' x2='160' y2='65' stroke='#F59E0B' stroke-width='4' stroke-linecap='round'/>
  <!-- Stacked Books -->
  <!-- Bottom Book 1 (Pink) -->
  <rect x='30' y='155' width='140' height='22' rx='4' fill='url(#book3)'/>
  <rect x='40' y='159' width='125' height='14' rx='2' fill='#FFF1F2'/>
  <rect x='28' y='155' width='12' height='22' rx='3' fill='#9D174D'/>
  <!-- Middle Book 2 (Green) -->
  <rect x='42' y='132' width='120' height='20' rx='4' fill='url(#book2)'/>
  <rect x='52' y='136' width='105' height='12' rx='2' fill='#ECFDF5'/>
  <rect x='40' y='132' width='12' height='20' rx='3' fill='#065F46'/>
  <!-- Top Book 3 (Blue) -->
  <rect x='52' y='110' width='100' height='19' rx='4' fill='url(#book1)'/>
  <rect x='62' y='114' width='85' height='11' rx='2' fill='#EFF6FF'/>
  <rect x='50' y='110' width='12' height='19' rx='3' fill='#1E40AF'/>
</svg>